name: Feature request
description: Propose a backlog item
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem statement, description: What user or operational problem should be solved?}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: Bullet list of testable outcomes.}
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 critical, P1 high, P2 medium, P3 low]
