# PanamaCompra Collector — change-detection + webhook + WAHA stack.
#
# This brings the parts that genuinely belong in containers into the repo so the
# trigger path is reproducible with a single `docker compose up -d`:
#
#   changedetection.io  watches the PanamaCompra table (rendered by sockpuppetbrowser)
#   sockpuppetbrowser   headless Chromium used by changedetection for JS pages
#   waha                self-hosted WhatsApp HTTP API for the alerts
#   webhook             src/10_webhook/010-webhook-listener.py in ENQUEUE-ONLY mode
#
# IMPORTANT — why "enqueue only": the actual collector (Playwright Firefox writing
# to the host ./records and ./data) runs on the HOST, not in a container. So the
# containerized listener only *records the request* into the shared ./data/queue
# volume; a tiny host service (./src/10_webhook/050-watch-queue-flag.sh, or the existing
# systemd webhook unit) then launches the real run. See the README "Run the stack
# with Docker Compose" section.
#
# Copy .env.example to .env first and set the values.
#
# Container data (changedetection datastore, WAHA sessions) lives inside the
# self-contained state directory: ${PC_INTEGRATIONS_DIR:-./var/integrations}.
# Prefer starting the stack through ./src/50_tools/010-docker-stack.sh, which resolves
# PC_INTEGRATIONS_DIR for every mode (development/portable/installed), applies
# monitor-saved container settings, and migrates a legacy ./integrations folder.

# Memory limits (PC_MEM_* in .env): this stack runs on small machines (the
# reference PC has 3.3 GiB RAM), and an unbounded Chromium (sockpuppet or
# WAHA's WEBJS engine) can push the whole desktop into swap. The caps below
# stop a runaway container without touching normal operation; raise them in
# .env on bigger hosts.
services:
  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:latest
    restart: unless-stopped
    # Chromium needs extra shared memory and a larger fd cap to stay stable.
    # (shm is allocated on demand, not reserved, but it counts against RAM —
    # keep it below the container cap on small hosts.)
    shm_size: ${PC_MEM_SOCKPUPPET_SHM:-768m}
    mem_limit: ${PC_MEM_SOCKPUPPET:-896m}
    cap_add:
      - SYS_ADMIN
    networks:
      - pc

  changedetection:
    image: dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    mem_limit: ${PC_MEM_CHANGEDETECTION:-384m}
    depends_on:
      - sockpuppetbrowser
    ports:
      - "5000:5000"
    environment:
      # changedetection renders JS watches through the sockpuppet browser.
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      # Public URL it advertises in its own UI/notification links.
      - BASE_URL=${CHANGEDETECTION_BASE_URL:-http://localhost:5000}
    volumes:
      - ${PC_INTEGRATIONS_DIR:-./var/integrations}/changedetection:/datastore
    # Lets watches/notifications reach the host too if you ever point them there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pc

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    # The default WEBJS engine runs a full Chromium inside this container; the
    # cap keeps its leaks/spikes away from the host. WAHA_ENGINE=NOWEB (re-scan
    # the QR after switching) drops WhatsApp RAM use to a fraction of this.
    mem_limit: ${PC_MEM_WAHA:-768m}
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      # Optional API key; when set, pass the same value as PC_WAHA_API_KEY to the
      # collector so it can authenticate to /api/sendText.
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WHATSAPP_DEFAULT_ENGINE=${WAHA_ENGINE:-WEBJS}
      # Dashboard login asked after every install/reinstall. setup.sh /
      # src/50_tools/010-docker-stack.sh generate a RANDOM password into .env and
      # data/config/integration-access.txt. This used to silently fall back to
      # a hardcoded, version-controlled password (12345678) if .env didn't set
      # one — replaced with a hard requirement instead: `docker compose up`
      # now fails fast with a clear message rather than ever starting WAHA
      # with a known-weak default.
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:?Set WAHA_DASHBOARD_PASSWORD in .env (see setup.sh / src/50_tools/010-docker-stack.sh) - no insecure default is provided.}
    volumes:
      - ${PC_INTEGRATIONS_DIR:-./var/integrations}/waha:/app/.sessions
    networks:
      - pc

  webhook:
    build:
      context: .
      dockerfile: docker/Dockerfile.webhook
    restart: unless-stopped
    mem_limit: ${PC_MEM_WEBHOOK:-128m}
    ports:
      - "${PC_WEBHOOK_PORT:-8765}:8765"
    environment:
      - PC_WEBHOOK_HOST=0.0.0.0
      - PC_WEBHOOK_PORT=8765
      # Containerized listener cannot launch the host browser pipeline, so it only
      # writes the run request into the shared ./data/queue volume. The host runner
      # (src/10_webhook/050-watch-queue-flag.sh / systemd) performs the actual collection.
      - PC_WEBHOOK_ENQUEUE_ONLY=1
    volumes:
      # Bind-mount the checkout so the listener writes the request flag and reads
      # .webhook_token from the same files the host collector uses.
      - .:/app
    working_dir: /app
    networks:
      - pc

networks:
  pc:
    driver: bridge
